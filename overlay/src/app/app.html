<div class="relative w-[1920px] h-[1080px] bg-balatro">

  <div class="absolute z-20 scale-75 -left-28.5 -top-4 [--square-progress-thickness:8px]">
    <app-delay-count
      class="absolute -inset-(--square-progress-thickness) z-10 pointer-events-none"
    />

    @if (restarting()) {
      <div
        class="relative w-[1920px] h-[1080px] rounded-[8px] bg-black flex items-center justify-center">
        <span class="text-white text-4xl text-center px-12">{{ restartMessage() }}</span>
      </div>
    } @else if (announcement()) {
      <div
        class="relative w-[1920px] h-[1080px] rounded-[8px] bg-black flex items-center justify-center">
        <span class="text-white text-4xl text-center px-12">{{ announcement() }}</span>
      </div>
    } @else {
      <app-game-overlay [overlayInfo]="overlayInfo()" class="" />
    }
  </div>


  <!-- Toujours visible, même hors partie (menu, chargement, etc.) -->

  <app-vote-count class="absolute w-[300px] left-1.5 top-1.5" />

  <app-mode-timer class="absolute left-1.5 bottom-4 w-[900px] pointer-events-none" />


  <div
    class="flex flex-col justify-start gap-2 absolute z-10 right-2.5 w-(--side-overlay-width) top-0 bottom-0 pointer-events-none
              bg-main-overlay-bg pt-[150px] px-1.5 pb-5 border-x-4 border-white">

    <img src="/logo.svg" class="logo">

    <app-available-actions
      class="w-full"
      [actions]="availableActions()"
    />

    <app-twitch-chat class="w-full flex-1 min-h-0" />

    <app-card color="green" class="absolute w-fit mx-auto -mt-5 text-2xl leading-1">
      ZEvent.fr
    </app-card>
  </div>
</div>
