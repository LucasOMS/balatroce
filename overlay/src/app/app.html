<div class="relative w-[1920px] h-[1080px] bg-zevent">


  <div class="absolute z-20 scale-75 -left-27 -top-4 [--square-progress-thickness:8px]">
    <app-delay-count
      class="absolute -inset-(--square-progress-thickness) z-10 pointer-events-none"
    />

    <app-game-overlay [overlayInfo]="overlayInfo()" class="" />
  </div>


  <!-- Toujours visible, même hors partie (menu, chargement, etc.) -->


  <div class="flex flex-col items-center justify-start gap-2 absolute z-10 right-1.5 w-(--side-overlay-width) top-1.5 bottom-1.5 pointer-events-none">
    <app-bid-war class="w-[400px] pointer-events-none" />

    <app-vote-count class="w-full" />

    <app-available-actions
      class="w-full"
      [actions]="availableActions()"
    />
  </div>
</div>
